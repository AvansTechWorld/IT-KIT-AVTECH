<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="IT Field Kit — calculators, reference, converters, flashcards, and work log. One installable PWA, fully offline." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>IT Field Kit</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-name">IT Field Kit</span>
      <span class="topbar-sub" id="view-sub">Calculators</span>
    </div>
    <button id="install-btn" class="install-btn hidden" aria-label="Install app">Install</button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Modules">
    <button class="nav-btn active" data-route="calculators" aria-label="Calculators">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v3h10V6H7zm0 5v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zM7 14v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z" fill="currentColor"/></svg>
      <span>Calc</span>
    </button>
    <button class="nav-btn" data-route="reference" aria-label="Reference">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3V3zm2 2v13a1 1 0 0 0 1 1h9V6a1 1 0 0 0-1-1H7zm2 3h7v2H9V8zm0 4h7v2H9v-2z" fill="currentColor"/></svg>
      <span>Ref</span>
    </button>
    <button class="nav-btn" data-route="converter" aria-label="Converter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12.6l-2.3-2.3 1.4-1.4L20 7.4 15.7 11.6l-1.4-1.4L16.6 9H4V7zm16 10H7.4l2.3-2.3-1.4-1.4L4 16.6l4.3 4.2 1.4-1.4L7.4 17H20v-2z" fill="currentColor"/></svg>
      <span>Convert</span>
    </button>
    <button class="nav-btn" data-route="learn" aria-label="Learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 8l11 5 9-4.1V17h2V8L12 3zM4 13.2V17c0 1.7 3.6 3 8 3s8-1.3 8-3v-3.8l-8 3.6-8-3.6z" fill="currentColor"/></svg>
      <span>Learn</span>
    </button>
    <button class="nav-btn" data-route="notes" aria-label="Notes and work log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm9 1.5V8h3.5L14 4.5zM7 11v2h10v-2H7zm0 4v2h7v-2H7z" fill="currentColor"/></svg>
      <span>Log</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
